<h2>Summary</h2>

<section class="summary-grid">
    <article class="summary-card income">
        <span>Total Income</span>
        <strong>{{ totalIncome | currency }}</strong>
    </article>

    <article class="summary-card expense">
        <span>Total Expense</span>
        <strong>{{ totalExpenses | currency }}</strong>
    </article>

    <article class="summary-card balance">
        <span>Balance</span>
        <strong>{{ balance | currency }}</strong>
    </article>
</section>
